name: Design system checks

# Master workflow for the design-system standardization effort (glific/glific-frontend#4052,
# enforcement tracked in #4081). Each job below is a separate guardrail; add new ones as
# jobs here (e.g. a stylelint token check) rather than as new workflow files, so all
# design-system gates show up together in PR checks.

on:
  push:
    branches: [master]
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  ratchet:
    name: Ratchet (violation counts can't increase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.tool-versions'

      - name: Run ratchet
        run: yarn design-system:ratchet

  eslint-mui-layering:
    name: ESLint - no new raw MUI imports in containers
    runs-on: ubuntu-latest
    # Diffs against the PR base, so this only runs (and only checks) files actually
    # changed in this PR — the ~97-file existing backlog is left to the ratchet job
    # above instead of blocking every unrelated PR.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.tool-versions'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Find changed container files
        id: changed
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD \
            | grep -E '^src/containers/.*\.tsx?$' \
            | grep -Ev '\.test\.tsx?$' || true)
          echo "files<<DIFF_EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "DIFF_EOF" >> "$GITHUB_OUTPUT"

      - name: Lint changed files for raw MUI imports
        if: steps.changed.outputs.files != ''
        run: |
          echo "${{ steps.changed.outputs.files }}" | xargs npx eslint --no-eslintrc -c .eslintrc.design-system.json
