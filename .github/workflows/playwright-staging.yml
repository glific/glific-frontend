name: Playwright - Staging exploratory tests

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: playwright-staging
  cancel-in-progress: false

jobs:
  playwright-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.tool-versions'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests against staging
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_STAGING_BASE_URL }}
          PLAYWRIGHT_STAGING_PHONE: ${{ secrets.PLAYWRIGHT_STAGING_PHONE }}
          PLAYWRIGHT_STAGING_PASSWORD: ${{ secrets.PLAYWRIGHT_STAGING_PASSWORD }}
        run: yarn pw:test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
